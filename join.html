<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הצטרפות לגלגל</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--deep:#0B4F7C;--blue:#2B78C5;--teal:#5CE1E6;--pink:#E2448F;--ink:#2F3437;--muted:#7A8489}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#EAF4FB;font-family:'Heebo',sans-serif;color:var(--ink)}
.wrap{max-width:460px;margin:0 auto;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:18px;min-height:100vh;justify-content:center}
.card{width:100%;background:#fff;border-radius:24px;box-shadow:0 14px 34px rgba(11,79,124,.14);padding:28px 22px;text-align:center}
.wheel{width:120px;height:120px;margin:0 auto 6px}
h1{margin:4px 0 2px;font-size:30px;color:var(--deep)}
.sub{margin:0 0 20px;font-size:18px;color:var(--muted)}
input{width:100%;border:2px solid var(--teal);border-radius:14px;padding:14px 16px;font:500 22px 'Heebo',sans-serif;text-align:center}
input:focus{outline:none;border-color:var(--pink)}
button{margin-top:14px;width:100%;background:var(--pink);color:#fff;border:0;border-radius:999px;font:700 24px 'Heebo',sans-serif;padding:14px;cursor:pointer}
button:disabled{opacity:.6}
.msg{margin-top:14px;font-size:20px;font-weight:700;color:var(--deep);min-height:1.4em}
.ok{font-size:26px;color:#1E9E5A}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <svg class="wheel" viewBox="0 0 64 64"><g transform="translate(32 35)"><path d="M0 0L0-26A26 26 0 0 1 22.5-13z" fill="#E2448F"/><path d="M0 0L22.5-13A26 26 0 0 1 22.5 13z" fill="#FFC83D"/><path d="M0 0L22.5 13A26 26 0 0 1 0 26z" fill="#3DBE7A"/><path d="M0 0L0 26A26 26 0 0 1-22.5 13z" fill="#2B78C5"/><path d="M0 0L-22.5 13A26 26 0 0 1-22.5-13z" fill="#7A5BD6"/><path d="M0 0L-22.5-13A26 26 0 0 1 0-26z" fill="#FA7548"/><circle r="5" fill="#fff"/></g><path d="M27 2h10l-5 9z" fill="#2F3437"/></svg>
  <h1>גלגל ההגרלה</h1>
  <p class="sub" id="sub">כתבו את השם שלכם, והוא ייכנס לגלגל</p>
  <input id="name" maxlength="40" placeholder="השם שלי" autocomplete="given-name">
  <button id="go">הכניסו אותי לגלגל</button>
  <div class="msg" id="msg"></div>
</div></div>
<script>
const SHEET_ID='1jZSeNE40Kd5q3K09NQ1xOOg1wJtwcPlyOx9acNoUfdg';
const SESSION=(new URLSearchParams(location.search).get('s')||'').replace(/[^\w-]/g,'').slice(0,10);
let API='';
const $=id=>document.getElementById(id);
if(SESSION)$('sub').textContent='מפגש '+SESSION+' · כתבו את השם שלכם, והוא ייכנס לגלגל';
try{$('name').value=localStorage.getItem('ideaName')||''}catch(e){}
function jsonp(url){return new Promise((ok,fail)=>{const cb='cb'+Date.now()+Math.floor(Math.random()*1e4),sc=document.createElement('script');const t=setTimeout(()=>fail(new Error('timeout')),15000);
  window[cb]=r=>{clearTimeout(t);ok(r);sc.remove()};sc.onerror=()=>{clearTimeout(t);fail(new Error('net'))};sc.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.body.appendChild(sc)})}
/* קישור הסקריפט נלקח מהגיליון: סוג = סקריפט */
(function(){const cb='cbS'+Date.now(),sc=document.createElement('script');
  window[cb]=r=>{try{const h=r.table.cols.map(c=>(c.label||'').trim());r.table.rows.forEach(row=>{const o={};h.forEach((k,i)=>{const c=row.c&&row.c[i];o[k]=c?String(c.v!=null?c.v:'').trim():''});if(o['סוג']==='סקריפט'&&o['קישור']&&!API)API=o['קישור']})}catch(e){}};
  sc.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=0&headers=1&tqx=out:json;responseHandler:${cb}`;document.body.appendChild(sc)})();
$('go').onclick=()=>{const name=$('name').value.trim();if(!name){$('name').focus();$('msg').textContent='כתבו את השם שלכם.';return}
  if(!API){$('msg').textContent='הגלגל עוד לא מחובר. נסו שוב בעוד רגע.';return}
  try{localStorage.setItem('ideaName',name)}catch(e){}
  $('go').disabled=true;$('msg').textContent='שולח...';
  jsonp(API+'?action=add&board=names&session='+encodeURIComponent(SESSION)+'&name='+encodeURIComponent(name)).then(r=>{
    if(!r||!r.ok)throw new Error('');$('msg').innerHTML='<span class="ok">השם שלך בגלגל!</span>';$('go').style.display='none';$('name').disabled=true})
   .catch(()=>{$('msg').textContent='לא הצלחנו. נסו שוב.';$('go').disabled=false})};
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
</script>
</body>
</html>
